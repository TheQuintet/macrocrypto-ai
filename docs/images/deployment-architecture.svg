<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 696" width="760" height="696" role="img" aria-label="Frontend is served by Vercel; the API and all services run on one VM with Docker Compose" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="696" fill="#ffffff"/>

  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">Frontend is served by Vercel; the API and all services run on one VM</text>

  <!-- Users -->
  <rect x="280" y="52" width="200" height="40" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="380" y="76" text-anchor="middle" fill="#1f1f1f">Users (browser)</text>

  <path d="M380 92V116" fill="none" stroke="#8a8a80" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="390" y="108" font-size="11.5" fill="#5f5f58">loads the app</text>

  <!-- Vercel -->
  <rect x="250" y="116" width="260" height="56" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="380" y="138" text-anchor="middle" font-weight="600" fill="#1f1f1f">Vercel</text>
  <text x="380" y="156" text-anchor="middle" font-size="11.5" fill="#5f5f58">frontend, static build</text>

  <!-- VM -->
  <rect x="24" y="192" width="712" height="416" rx="8" fill="#f3f3ef" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="40" y="216" font-weight="600" fill="#1f1f1f">VM · Docker Compose · private network</text>

  <!-- Vercel to nginx: drawn after the VM box so it stays visible -->
  <path d="M380 172V232" fill="none" stroke="#8a8a80" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="390" y="204" font-size="11.5" fill="#5f5f58">API calls, HTTPS 443</text>

  <!-- nginx -->
  <rect x="250" y="232" width="260" height="56" rx="8" fill="#2b6cb0" fill-opacity="0.12" stroke="#2b6cb0" stroke-width="2"/>
  <text x="380" y="256" text-anchor="middle" font-weight="600" fill="#1f1f1f">nginx (reverse proxy)</text>
  <text x="380" y="272" text-anchor="middle" font-size="11.5" fill="#5f5f58">TLS · api.&lt;domain&gt; only</text>

  <path d="M380 288V320" fill="none" stroke="#8a8a80" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="390" y="308" font-size="11.5" fill="#5f5f58">/api requests</text>

  <!-- api-gateway -->
  <rect x="280" y="320" width="200" height="40" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="380" y="344" text-anchor="middle" font-weight="600" fill="#1f1f1f">api-gateway</text>

  <!-- gateway to services -->
  <g fill="none" stroke="#8a8a80" stroke-width="1.25">
    <path d="M380 360V376H152V392" marker-end="url(#arrow)"/>
    <path d="M380 376V392" marker-end="url(#arrow)"/>
    <path d="M380 376H608V392" marker-end="url(#arrow)"/>
  </g>

  <!-- services -->
  <rect x="48" y="392" width="208" height="56" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="152" y="416" text-anchor="middle" font-weight="600" fill="#1f1f1f">data-service</text>
  <text x="152" y="432" text-anchor="middle" font-size="11.5" fill="#5f5f58">ingests market data</text>

  <rect x="276" y="392" width="208" height="56" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="380" y="416" text-anchor="middle" font-weight="600" fill="#1f1f1f">ai-service</text>
  <text x="380" y="432" text-anchor="middle" font-size="11.5" fill="#5f5f58">predicts, retrains 06:00 UTC</text>

  <rect x="504" y="392" width="208" height="56" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="608" y="416" text-anchor="middle" font-weight="600" fill="#1f1f1f">alert-service</text>
  <text x="608" y="432" text-anchor="middle" font-size="11.5" fill="#5f5f58">evaluates price alerts</text>

  <!-- services to infrastructure -->
  <g fill="none" stroke="#8a8a80" stroke-width="1.25">
    <path d="M152 448V464M380 448V464M608 448V464M128 464H632"/>
    <path d="M128 464V480" marker-end="url(#arrow)"/>
    <path d="M296 464V480" marker-end="url(#arrow)"/>
    <path d="M464 464V480" marker-end="url(#arrow)"/>
    <path d="M632 464V480" marker-end="url(#arrow)"/>
  </g>

  <!-- infrastructure -->
  <rect x="52" y="480" width="152" height="56" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="128" y="504" text-anchor="middle" font-weight="600" fill="#1f1f1f">postgres</text>
  <text x="128" y="520" text-anchor="middle" font-size="11.5" fill="#5f5f58">TimescaleDB</text>

  <rect x="220" y="480" width="152" height="56" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="296" y="504" text-anchor="middle" font-weight="600" fill="#1f1f1f">redis</text>
  <text x="296" y="520" text-anchor="middle" font-size="11.5" fill="#5f5f58">cache</text>

  <rect x="388" y="480" width="152" height="56" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="464" y="504" text-anchor="middle" font-weight="600" fill="#1f1f1f">rabbitmq</text>
  <text x="464" y="520" text-anchor="middle" font-size="11.5" fill="#5f5f58">event bus</text>

  <rect x="556" y="480" width="152" height="56" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="632" y="504" text-anchor="middle" font-weight="600" fill="#1f1f1f">mlflow</text>
  <text x="632" y="520" text-anchor="middle" font-size="11.5" fill="#5f5f58">tracking, registry</text>

  <!-- persistent volumes -->
  <rect x="40" y="552" width="680" height="40" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="380" y="576" text-anchor="middle" fill="#1f1f1f">Persistent volumes: postgres_data · rabbitmq_data · mlflow_data · model files</text>

  <!-- off-server backup -->
  <path d="M380 592V640" fill="none" stroke="#8a8a80" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="390" y="620" font-size="11.5" fill="#5f5f58">nightly pg_dump</text>
  <rect x="230" y="640" width="300" height="40" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="380" y="664" text-anchor="middle" fill="#1f1f1f">Off-server backup storage</text>
</svg>
