services:
  # ============================================
  # INFRASTRUCTURE SERVICES
  # ============================================
  
  postgres:
    image: postgres:15-alpine
    container_name: macro-postgres
    environment:
      POSTGRES_USER: macro
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: macrocrypto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macro -d macrocrypto"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - macro-network

  redis:
    image: redis:7-alpine
    container_name: macro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - macro-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: macro-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - macro-network

  # ============================================
  # MICROSERVICES
  # ============================================

  data-service:
    build:
      context: ./services/data-service
      dockerfile: Dockerfile
    container_name: macro-data-service
    ports:
      - "8001:8001"
    # # ✅ ADD DNS CONFIGURATION
    # dns:
    #   - 8.8.8.8
    #   - 1.1.1.1
    #   - 8.8.4.4
    environment:
      # Override Redis host to use Docker service name
      - REDIS_HOST=redis
      # Override database host to use Docker service name
      - DATABASE_URL=postgresql://macro:crypto@postgres:5432/macrocrypto
      # Override RabbitMQ host to use Docker service name
      - RABBITMQ_HOST=rabbitmq
      # ✅ ADD PYTHONUNBUFFERED for better logging
      - PYTHONUNBUFFERED=1
    volumes:
      - ./services/data-service/app:/app/app
      - ./services/data-service/tests:/app/tests
      - ./shared:/app/shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ./services/data-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - macro-network
    restart: unless-stopped

