name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker images
        run: |
          # Image names must be lowercase; github.repository keeps the org's capitals
          image_repo="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          # Build and push each service if Dockerfile exists
          for service in services/*/; do
            service_name=$(basename "$service")
            if [ -f "${service}Dockerfile" ]; then
              echo "Building $service_name..."
              docker build -t "$image_repo/$service_name:latest" -f ${service}Dockerfile ${service}
              docker push "$image_repo/$service_name:latest"
            fi
          done